spring.application.name=movie-api

# Cloud Run injects the port to listen on via $PORT; 8080 otherwise.
server.port=${PORT:8080}

# Strict JSON request bodies (ADR-0012): a typo such as "synopsys" must not silently drop data,
# and values are never converted ("1986", 1986.5 or 123 for a text are rejected with 400).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false
# A repeated key ({"name": "A", "name": "B"}) would silently keep only the last value.
spring.jackson.parser.strict-duplicate-detection=true

# Document only the responses declared on each operation, not every exception the advice can map
# (ADR-0011).
springdoc.override-with-generic-response=false

# Reload the in-memory catalog when it is older than this (ADR-0007, ADR-0013). Each load reads every
# movie document, so a shorter interval costs Firestore reads.
app.catalog.refresh-interval=60m
# Load the sample movies on startup when the catalog is empty (ADR-0006).
app.seed.enabled=true

# Let in-flight requests finish when Cloud Run stops an instance. Cloud Run allows about 10 seconds
# after SIGTERM, so the wait is shorter than Spring's default of 30 seconds.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
