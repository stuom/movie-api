# Add to src/main/resources/application.properties

# Cloud Run injects the port to listen on via $PORT; default 8080 for local runs.
server.port=${PORT:8080}
# Let in-flight requests finish when Cloud Run stops an instance.
server.shutdown=graceful
# Cloud Run allows about 10 seconds after SIGTERM; Spring's default wait is 30 seconds.
spring.lifecycle.timeout-per-shutdown-phase=8s

# Firestore: no settings needed in the cloud. Application Default Credentials (the Cloud Run service account)
# and the project are discovered automatically.

# Insert sample movies on startup when the collection is empty (costs one read per cold start).
app.seed.enabled=true

# Reload the in-memory movie catalog from Firestore after this interval (each reload reads every movie once).
app.catalog.refresh-interval=60m
